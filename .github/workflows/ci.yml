name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: the formatter's output changes between SDK releases, so the
      # format check only means something against one version.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      # One platform is enough for these two, and a Windows checkout's line
      # endings would fail the format check for no reason.
      - if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed lib bin test
      - if: matrix.os == 'ubuntu-latest'
        run: dart analyze --fatal-infos lib bin test
      - run: dart test
        env:
          # Runs the one test that installs from pub.dev (`fl upgrade`).
          FL_TEST_NETWORK: '1'
